<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuickFiix — Sign In</title>

  <!-- Google Fonts: Poppins for premium UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/login.css?v=3">
  
  <style>
    /* Absolute brute-force override to guarantee scrolling */
    html, body {
      overflow-y: auto !important;
      overflow-x: hidden !important;
      height: auto !important;
      min-height: 100% !important;
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-wrapper">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="mouse-glow" id="mouseGlow"></div>
  </div>

  <div class="login-shell">
    <div class="login-card">
      
      <div class="login-header">
        <div class="logo-box">
          <i data-lucide="wrench"></i>
        </div>
        <h1 class="brand-title">QuickFiix</h1>
        <p class="brand-subtitle">Emergency Mechanic Finder</p>
        <p class="welcome-text">Welcome back! Login to access emergency roadside assistance.</p>
      </div>

      <form id="loginForm" novalidate>
        
        <!-- User Details Section -->
        <div class="form-section">
          <div class="input-group">
            <span class="icon-wrapper"><i data-lucide="user"></i></span>
            <input type="text" id="loginName" placeholder=" " required autocomplete="name">
            <label class="float-label">Full Name</label>
            <div class="focus-border"></div>
          </div>

          <div class="input-group">
            <span class="icon-wrapper"><i data-lucide="mail"></i></span>
            <input type="email" id="loginEmail" placeholder=" " required autocomplete="email">
            <label class="float-label">Email Address</label>
            <div class="focus-border"></div>
          </div>

          <div class="input-group">
            <span class="icon-wrapper"><i data-lucide="phone"></i></span>
            <input type="tel" id="loginPhone" placeholder=" " required autocomplete="tel">
            <label class="float-label">Phone Number</label>
            <div class="focus-border"></div>
          </div>
        </div>

        <!-- Emergency Guardians Section -->
        <div class="guardian-card">
          <div class="g-card-header">
            <div class="g-title-row">
              <i data-lucide="shield-alert"></i>
              <h3>Emergency Guardians</h3>
            </div>
            <p class="g-desc">Your guardians will receive SOS alerts, live location, and emergency notifications.</p>
          </div>
          
          <div id="guardianContainer"></div>

          <button type="button" id="addGuardianBtn" class="add-btn">
            <i data-lucide="plus"></i> Add Another Guardian
          </button>
        </div>

        <!-- Options Section -->
        <div class="options-section">
          <label class="checkbox-container">
            <input type="checkbox" id="rememberMe" checked>
            <span class="checkmark"></span>
            Remember Me
          </label>
          <label class="checkbox-container">
            <input type="checkbox" id="termsBox" required>
            <span class="checkmark"></span>
            <span>I agree to the <a href="#" class="text-link">Terms & Conditions</a> and <a href="#" class="text-link">Privacy Policy</a></span>
          </label>
        </div>

        <div id="loginError" class="error-msg"></div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="premium-submit">
          <div class="btn-content" id="btnContent">
            <span>Continue</span>
            <i data-lucide="arrow-right"></i>
          </div>
          <div class="btn-spinner" id="btnSpinner" style="display: none;">
            <i data-lucide="loader-2" class="spin-icon"></i>
            <span>Signing In...</span>
          </div>
          <div class="btn-success" id="btnSuccess" style="display: none;">
            <i data-lucide="check-circle"></i>
            <span>Success</span>
          </div>
        </button>

      </form>
    </div>
  </div>

  <script src="js/login.js?v=3"></script>
</body>
</html>
